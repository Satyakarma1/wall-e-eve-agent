<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WALL-E &amp; EVE — mission replay</title>
<style>
  :root {
    color-scheme: dark;
    --page: #141413;
    --surface-1: #1d1c1a;
    --surface-2: #2a2926;
    --border: #383733;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8d86;
    --walle: #c98500;
    --eve: #3987e5;
    --good: #0ca30c;
    --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text-primary);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 1200px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .sub { color: var(--text-secondary); font-size: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
    font-weight: 700; font-size: 12px; border: 1px solid var(--border); background: var(--surface-1); }
  .badge.ok { color: #8fdc8f; border-color: #2d5a2d; }
  .badge.bad { color: #f2a0a0; border-color: #6b2c2c; }
  .main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(290px, 1fr); gap: 10px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
  .stage { padding: 8px; display: flex; justify-content: center; }
  canvas#map { display: block; border-radius: 8px; }
  .panel { padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; min-width: 0; }
  .stepline { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .7px; }
  .action { font-size: 22px; font-weight: 750; letter-spacing: .3px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px;
    font-weight: 650; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .reason { font-size: 13px; min-height: 40px; }
  .events { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; min-height: 20px; }
  .events li { font-size: 12px; color: var(--text-secondary); padding-left: 14px; position: relative; }
  .events li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--text-muted); }
  .events li.alert { color: #f4aaaa; } .events li.alert::before { background: var(--critical); }
  .events li.good { color: #a6e6a6; } .events li.good::before { background: var(--good); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 0; }
  .meter { display: grid; grid-template-columns: 96px 1fr 74px; align-items: center; gap: 10px;
    font-size: 12px; color: var(--text-secondary); }
  .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; background: var(--walle); }
  .value { color: var(--text-primary); font-variant-numeric: tabular-nums; text-align: right; }
  .pips { display: flex; gap: 6px; }
  .pips b { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #199e70; }
  .pips b.on { background: #199e70; }
  .status { display: grid; grid-template-columns: 96px 1fr 74px; gap: 10px; align-items: center;
    font-size: 12px; color: var(--text-secondary); }
  .split { height: 8px; border-radius: 999px; overflow: hidden; display: flex; background: var(--surface-2); gap: 2px; }
  .split span { display: block; height: 100%; }
  .beacons { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
  .beacons .row { display: flex; justify-content: space-between; gap: 8px; }
  .beacons .spoof { color: #f4aaaa; font-weight: 650; }
  .controls { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; color: var(--text-primary); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: #5c5a54; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--eve); outline-offset: 2px; }
  button.primary { background: var(--walle); color: #141413; border-color: var(--walle); font-weight: 750; min-width: 84px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 6px 9px; color: var(--text-secondary); }
  .seg button.on { background: var(--surface-2); color: var(--text-primary); font-weight: 650; }
  label.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); font-size: 12px; cursor: pointer; }
  label.toggle input { accent-color: var(--eve); }
  label.toggle.disabled { opacity: .45; cursor: not-allowed; }
  .spacer { flex: 1; }
  .counter { color: var(--text-secondary); font-variant-numeric: tabular-nums; font-size: 12px; }
  canvas#timeline { width: 100%; height: 50px; display: block; cursor: pointer; }
  .log { display: flex; gap: 6px; flex-wrap: wrap; }
  .log button { font-size: 11.5px; padding: 4px 8px; display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .log button i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .log button.on { color: var(--text-primary); border-color: var(--text-muted); background: #34332f; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); padding: 0 4px; }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .verdict { padding: 12px 16px; display: none; gap: 6px; flex-direction: column; border-left: 4px solid var(--good); }
  .verdict.show { display: flex; }
  .verdict.bad { border-left-color: var(--critical); }
  .verdict b { font-size: 14px; }
  .verdict p { margin: 0; color: var(--text-secondary); }
  @media (max-width: 780px) { .main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 id="title">WALL-E &amp; EVE</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <span class="badge" id="outcome"></span>
  </header>

  <div class="main">
    <div class="card stage" id="stage"><canvas id="map" role="img" aria-label="Animated mission map"></canvas></div>
    <div class="card panel" aria-live="polite">
      <div class="stepline"><span id="stepNo">Start</span><span id="posLabel"></span></div>
      <div class="action" id="action">BRIEFING</div>
      <div><span class="chip" id="chip"><i></i><span>Briefing</span></span></div>
      <div class="reason" id="reason"></div>
      <ul class="events" id="events"></ul>
      <hr>
      <div class="meter"><span>Battery</span><div class="bar"><span id="batteryBar"></span></div><span class="value" id="batteryVal"></span></div>
      <div class="meter"><span>Pulse scans</span><div class="pips" id="pips"></div><span class="value" id="scanVal"></span></div>
      <div class="meter"><span>Best guess</span><div class="bar"><span id="topBar" style="background: var(--eve)"></span></div><span class="value" id="topVal"></span></div>
      <div class="meter"><span>Uncertainty</span><div class="bar"><span id="entBar" style="background: #8f8d86"></span></div><span class="value" id="entVal"></span></div>
      <div class="status"><span>EVE status</span>
        <div class="split"><span id="pa" style="background: var(--eve)"></span><span id="pd" style="background: #8f8d86"></span></div>
        <span class="value" id="statusVal"></span></div>
      <div class="beacons" id="beacons"></div>
    </div>
  </div>

  <div class="card verdict" id="verdict"></div>

  <div class="card controls">
    <div class="row1">
      <button class="primary" id="play" aria-label="Play or pause (space)">▶ Play</button>
      <button id="back" aria-label="Previous step (left arrow)">⏮</button>
      <button id="fwd" aria-label="Next step (right arrow)">⏭</button>
      <button id="restart" aria-label="Restart (home)">↺</button>
      <div class="seg" id="speed" role="group" aria-label="Playback speed"></div>
      <label class="toggle"><input type="checkbox" id="showBelief" checked> Belief heatmap</label>
      <label class="toggle"><input type="checkbox" id="showPlan" checked> Planned route</label>
      <label class="toggle disabled" id="truthLabel" title="Unlocks when the replay reaches the end">
        <input type="checkbox" id="showTruth" disabled> Evaluation view (ground truth)</label>
      <span class="spacer"></span>
      <span class="counter" id="counter"></span>
    </div>
    <canvas id="timeline" aria-label="Strategy timeline: click or drag to jump to a step"></canvas>
    <div class="log" id="log" aria-label="Strategy changes"></div>
  </div>
  <div class="legend" id="legend"></div>
</div>

  // ------------------------------------------------------------------ playback state

  // strategy change log
  const logButtons = D.transitions.map(([step, strat, reason]) => {

  // ------------------------------------------------------------------ drawing helpers

      drawEve(cx(D.truth.eve[1]), cy(D.truth.eve[0]), 0.9, pulse);
      ctx.fillStyle = C.text; ctx.font = `bold ${Math.max(9, cs * 0.28)}px system-ui`; ctx.textAlign = "center";
      ctx.fillText("EVE (true position)", cx(D.truth.eve[1]), cy(D.truth.eve[0]) - cs * 0.62);
    }

    const bob = playing && !REDUCED ? Math.sin(now / 90) * cs * 0.02 : 0;
    drawWallE(px, py, dir, s ? s.strategy : (STEPS[N - 1] || {}).strategy, bob);

    // strategy change toast
    const prev = i > 0 ? STEPS[i - 1].strategy : null;
    if (s && s.strategy !== prev && f < 0.85) {
      const label = "→ " + (LABELS[s.strategy] || s.strategy);
      ctx.font = `bold ${Math.max(10, cs * 0.34)}px system-ui`;
      const tw = ctx.measureText(label).width + 14, th = Math.max(18, cs * 0.6);
      let bx = Math.min(Math.max(px - tw / 2, ox), ox + COLS * cs - tw), by = py - cs * 1.25 - th / 2;
      if (by < oy) by = py + cs * 0.7;
      ctx.save(); ctx.globalAlpha = f > 0.6 ? (0.85 - f) / 0.25 : 1;
      ctx.fillStyle = "#1d1c1a"; ctx.strokeStyle = COLORS[s.strategy] || "#888"; ctx.lineWidth = 2;
      roundRect(ctx, bx, by, tw, th, th / 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.text; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(label, bx + 7, by + th / 2);
      ctx.restore();
    }
  }

  // ------------------------------------------------------------------ timeline render
  function drawTimeline() {
    const w = tl.clientWidth || 600, h = 50;
    tctx.clearRect(0, 0, w, h);
    if (!N) return;
    const bw = w / N, top = 16, bh = 16;
    STEPS.forEach((s, k) => {
      tctx.fillStyle = COLORS[s.strategy] || "#888";
      tctx.fillRect(k * bw, top, Math.max(1, bw - (bw > 4 ? 1 : 0)), bh);
      const x = k * bw + bw / 2;
      if (s.action === "SCAN") { tctx.fillStyle = "#199e70"; tctx.beginPath(); tctx.arc(x, 8, 3.5, 0, 2 * Math.PI); tctx.fill(); }
      if (s.action === "INSPECT") { tctx.fillStyle = "#d95926"; tctx.fillRect(x - 3, 5, 6, 6); }
      if (s.action === "RECHARGE") { tctx.fillStyle = "#0ca30c"; tctx.fillRect(x - 1.5, 3, 3, 10); }
      if (s.events.some(ev => ev.includes("rejected as spoofed"))) {
        tctx.strokeStyle = "#d03b3b"; tctx.lineWidth = 2; tctx.beginPath();
        tctx.moveTo(x - 4, 4); tctx.lineTo(x + 4, 12); tctx.moveTo(x + 4, 4); tctx.lineTo(x - 4, 12); tctx.stroke();
      }
      if (s.events.some(ev => ev.includes("EVE sighted"))) { tctx.fillStyle = "#f0efec"; tctx.beginPath(); tctx.arc(x, 8, 3.5, 0, 2 * Math.PI); tctx.fill(); }
    });
    const x = (t / N) * w;
    tctx.fillStyle = "#f0efec"; tctx.fillRect(x - 1, 2, 2, h - 4);
    tctx.fillStyle = "#8f8d86"; tctx.font = "10.5px system-ui"; tctx.textAlign = "left"; tctx.textBaseline = "alphabetic";
    tctx.fillText("step 0", 0, h - 3); tctx.textAlign = "right"; tctx.fillText("step " + N, w, h - 3);
  }

  // ------------------------------------------------------------------ side panel
  function updatePanel() {
    const i = Math.min(Math.floor(t), N), f = t - i;
    const A = frames[i], B = frames[Math.min(i + 1, N)], s = i < N ? STEPS[i] : null;
    const battery = s && f > 0 ? lerp(A.battery, B.battery, ease(f)) : A.battery;
    $("batteryBar").style.width = (100 * battery / (M.capacity || 100)).toFixed(1) + "%";
    $("batteryBar").style.background = battery < 0.25 * (M.capacity || 100) ? "#d03b3b" : "var(--walle)";
    $("batteryVal").textContent = `${battery.toFixed(0)} / ${M.capacity}`;
    $("counter").textContent = `step ${Math.min(Math.floor(t), N)} / ${N}`;
    if (panelIndex === i) return;
    panelIndex = i;

    if (s) {
      $("stepNo").textContent = `Step ${s.step} of ${N}`;
      $("posLabel").textContent = `at (${s.from[0]}, ${s.from[1]})`;
      $("action").textContent = s.action.replaceAll("_", " ");
      $("chip").innerHTML = `<i style="background:${COLORS[s.strategy]}"></i><span>${LABELS[s.strategy] || s.strategy}</span>`;
      $("reason").textContent = s.reason;
      $("events").innerHTML = s.events.map(ev => {
        const cls = /spoofed|Bumped/.test(ev) ? "alert" : /EVE sighted|Rendezvous|Recharged/.test(ev) ? "good" : "";
        return `<li class="${cls}">${ev.replace(/[<>&]/g, ch => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[ch])}</li>`;
      }).join("");
    } else {
      $("stepNo").textContent = `Mission end · ${N} steps`;
      $("posLabel").textContent = `at (${A.pos[0]}, ${A.pos[1]})`;
      $("action").textContent = O.status.replaceAll("_", " ");
      $("chip").innerHTML = `<i style="background:${O.success ? "#0ca30c" : "#d03b3b"}"></i><span>${O.conclusion.replaceAll("_", " ")}</span>`;
      $("reason").textContent = O.recommendation;
      $("events").innerHTML = "";
    }

    const total = M.scan_budget || 0;
    $("pips").innerHTML = Array.from({ length: total }, (_, k) => `<b class="${k < A.scansLeft ? "on" : ""}"></b>`).join("");
    $("scanVal").textContent = `${A.scansLeft} left`;
    $("topBar").style.width = (100 * (A.topP || 0)).toFixed(1) + "%";
    $("topVal").textContent = A.top ? `(${A.top[0]}, ${A.top[1]}) ${(100 * (A.topP || 0)).toFixed(0)}%` : "–";
    $("entBar").style.width = (100 * (A.entropy || 0) / maxEntropy).toFixed(1) + "%";
    $("entVal").textContent = `${(A.entropy || 0).toFixed(1)} bits`;
    const pa = (A.status && A.status.ACTIVE) || 0, pd = (A.status && A.status.DORMANT) || 0;
    $("pa").style.width = (100 * pa).toFixed(1) + "%"; $("pd").style.width = (100 * pd).toFixed(1) + "%";
    $("statusVal").textContent = pa >= pd ? `active ${(100 * pa).toFixed(0)}%` : `dormant ${(100 * pd).toFixed(0)}%`;
    const rel = Object.entries(A.reliability || {});
    $("beacons").innerHTML = rel.length ? rel.map(([k, p]) => {
      const spoof = A.flagged.has(k);
      return `<div class="row"><span>Beacon (${k.replace(",", ", ")})</span><span class="${spoof ? "spoof" : ""}">${spoof ? "✕ spoofed · " : ""}P(genuine) ${(100 * p).toFixed(0)}%</span></div>`;
    }).join("") : `<div class="row"><span>No beacon decoded yet</span><span></span></div>`;

    let current = null;
    logButtons.forEach(lb => { if (lb.step <= (s ? s.step : N)) current = lb; });
    logButtons.forEach(lb => lb.b.classList.toggle("on", lb === current));

    const ended = t >= N;
    $("showTruth").disabled = !ended;
    $("truthLabel").classList.toggle("disabled", !ended);
    if (!ended && $("showTruth").checked) $("showTruth").checked = false;
    const v = $("verdict");
    v.classList.toggle("show", ended);
    v.classList.toggle("bad", !O.success);
    if (ended) {
      const loc = `(${O.map_estimate[0]}, ${O.map_estimate[1]})`;
      v.innerHTML = `<b>${O.success ? "Rendezvous complete" : "Mission ended: " + O.status.replaceAll("_", " ")} — ${O.conclusion.replaceAll("_", " ")}</b>` +
        `<p>EVE location ${loc} (P=${O.map_probability.toFixed(2)}) · status ${O.status_estimate} (${(100 * O.status_confidence).toFixed(0)}% confidence) · battery left ${O.battery_remaining} · ${O.recharges} recharge(s)</p>` +
        `<p><b style="font-size:12.5px">Recommended next step:</b> ${O.recommendation}</p>`;
    }
  }

  // ------------------------------------------------------------------ loop
  function tick(now) {
    if (playing) {
      if (lastNow !== null) {
        let dt = now - lastNow;
        while (dt > 0 && t < N) {
          const i = Math.floor(t), dur = durationOf(i), remaining = (i + 1 - t) * dur;
          if (dt >= remaining) { t = i + 1; dt -= remaining; } else { t += dt / dur; dt = 0; }
        }
        if (t >= N) { t = N; setPlaying(false); }
      }
      lastNow = now;
    }
    const animating = playing || (frames[Math.min(Math.floor(t), N)].eve || $("showTruth").checked);
    if (playing || dirty || animating) {
      drawMap(now); drawTimeline(); updatePanel(); dirty = false;
    }
    requestAnimationFrame(tick);
  }
  resize();
  const deepLink = /step=(\d+)/.exec(location.hash);
  if (deepLink) t = Math.min(N, Number(deepLink[1]));
  updatePanel();
  requestAnimationFrame(tick);
  if (D.autoplay && !REDUCED && !deepLink) setTimeout(() => setPlaying(true), 700);
})();
</script>
</body>
</html>
